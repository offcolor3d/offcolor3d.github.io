name: Deploy Astro to GitHub Pages

on:
  # Se ejecuta automáticamente cuando subes cambios a la rama main
  push:
    branches: [ "main" ]
  # Te permite ejecutar este flujo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

# Configura los permisos del GITHUB_TOKEN para permitir el despliegue en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se acumulen despliegues simultáneos si haces push muy seguidos
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # Deja "." si tu proyecto de Astro está en la raíz del repositorio

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: "${{ env.BUILD_PATH }}/package-lock.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

        # Asume la variable de entorno secreta del repo para construir urls.
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ env.BUILD_PATH }}/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4